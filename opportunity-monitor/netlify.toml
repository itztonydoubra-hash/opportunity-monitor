# Netlify configuration. The Next.js runtime plugin is auto-installed by Netlify
# when it detects a Next.js app, but we declare it here to be explicit.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Streaming + the research route can run longer than a default function.
# Netlify allows up to 10s on the free tier and longer on paid plans.
